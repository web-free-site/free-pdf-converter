{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav
  class="fpc-nav bg-slate-950/90 border-b border-teal-900/40 sticky top-0 z-30 backdrop-blur-md"
>
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/fpc-logo.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Free PDF Converter{{/if}} Logo"
          class="h-9 w-9"
        />
        <span
          id="nav-brand"
          class="text-white font-bold text-lg ml-2 tracking-tight"
        >
          <a href="/"
            >{{#if brandName}}{{brandName}}{{else}}Free PDF Converter{{/if}}</a
          >
        </span>
      </div>

      <div
        class="hidden lg:flex flex-1 items-center justify-center gap-6 xl:gap-10"
      >
        <a href="/" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="/merge-pdf" class="nav-link">Merge PDF</a>
        <a href="/split-pdf" class="nav-link">Split PDF</a>
        <a href="/compress-pdf" class="nav-link">Compress PDF</a>
        <a href="/about" class="nav-link" data-i18n="nav.about">About</a>
        <a href="/contact" class="nav-link" data-i18n="nav.contact">Contact</a>
      </div>

      <div
        class="hidden lg:flex items-center flex-shrink-0 gap-3"
        id="lang-switcher-slot"
      ></div>

      <button
        id="mobile-menu-button"
        type="button"
        class="lg:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-200 hover:text-teal-300"
        aria-controls="mobile-menu"
        aria-expanded="false"
        aria-label="Open menu"
      >
        <svg
          id="menu-icon"
          class="block h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          id="close-icon"
          class="hidden h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <div
    id="mobile-menu"
    class="lg:hidden hidden border-t border-white/10 bg-slate-950"
  >
    <div class="px-4 pt-2 pb-4 space-y-1">
      <a href="/" class="nav-link block py-2" data-i18n="nav.home">Home</a>
      <a href="/merge-pdf" class="nav-link block py-2">Merge PDF</a>
      <a href="/split-pdf" class="nav-link block py-2">Split PDF</a>
      <a href="/compress-pdf" class="nav-link block py-2">Compress PDF</a>
      <a href="/about" class="nav-link block py-2" data-i18n="nav.about"
        >About</a
      >
      <a href="/contact" class="nav-link block py-2" data-i18n="nav.contact"
        >Contact</a
      >
      <div id="lang-switcher-slot-mobile" class="pt-2"></div>
    </div>
  </div>
</nav>
<script type="module" src="/src/js/mobileMenu.ts"></script>
{{/if}}
